spring.application.name=biblioteca-digital
server.port=8080

# ===== Banco de dados =====
# A senha NÃO fica neste arquivo (ele vai para o GitHub). Duas formas de informá-la:
#  1) criar o arquivo application-local.properties na raiz do projeto (já está no .gitignore) com:
#         spring.datasource.password=SUA_SENHA
#  2) definir a variável de ambiente SPRING_DATASOURCE_PASSWORD (é o que a pipeline do GitHub faz).
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_digital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&yearIsDateType=false
spring.datasource.username=root
spring.datasource.password=

spring.thymeleaf.cache=false

# ===== Upload das capas dos livros =====
biblioteca.upload-dir=uploads
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB