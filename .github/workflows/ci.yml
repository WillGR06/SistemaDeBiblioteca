name: CI

# Roda a cada push na main e a cada pull request para a main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Criar o banco de teste
        run: |
          mysql -h 127.0.0.1 -uroot -proot < sql/teste/01_tabelas_teste.sql
          mysql -h 127.0.0.1 -uroot -proot < sql/teste/02_logica_teste.sql

      - name: Testes unitários e de integração, cobertura mínima de 75% (JaCoCo)
        run: mvn -B verify

      - name: Análise estática e quality gate (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -Dsonar.qualitygate.wait=true

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco
